# Continuous integration.
#
# This job runs on macOS runners on purpose. The package declares
# "os": ["darwin"] and its test skips itself on any other platform, so a green
# Linux run would prove nothing at all.
#
# GitHub's macOS runners are virtualised and have no backlit keyboard, so the
# smoke test will report SKIP rather than PASS there. That is the honest
# outcome: CI verifies the package loads, resolves the CoreBrightness symbols
# and does not crash, and a human verifies the hardware path locally. Do not
# "fix" this by asserting on a keyboard that is not present.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this in step with the "engines" field in package.json.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job never pushes. Leaving the token in .git/config would let any
          # later step, including a compromised dependency, use it.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The library must at minimum load, reach the framework and resolve the
      # class. This fails loudly if Apple moves or renames the private symbol.
      - name: Module loads and resolves CoreBrightness
        run: |
          node -e "
            const kbd = require('./src/index.js');
            const ids = kbd.keyboardIDs();
            console.log('keyboards:', ids.length);
          "

      - name: CLI help exits zero
        run: node bin/kbdlight.js --help

  meta:
    name: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job never pushes. Leaving the token in .git/config would let any
          # later step, including a compromised dependency, use it.
          persist-credentials: false

      # House rules, enforced rather than requested. Both are in CONTRIBUTING.
      - name: No em dashes or en dashes
        run: |
          set -eu
          if git grep -I -n -P '\xe2\x80\x94|\xe2\x80\x93' -- . > /tmp/dashes.txt; then
            echo "Em dashes or en dashes found. Use a comma, semicolon, colon, period or parentheses:" >&2
            cat /tmp/dashes.txt >&2
            exit 1
          fi

      - name: No emoji
        run: |
          set -eu
          if git grep -I -n -P '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' -- . > /tmp/emoji.txt; then
            echo "Emoji found. This project does not use them:" >&2
            cat /tmp/emoji.txt >&2
            exit 1
          fi

      # The README points at raw.githubusercontent.com so the images also load
      # on the npm package page. A file that moved breaks both at once.
      - name: README assets exist
        run: |
          set -eu
          missing=0
          # Read line by line, not word by word: a path containing a space would
          # otherwise be split and reported as two missing files.
          grep -o 'raw.githubusercontent.com/noluyorAbi/macos-keyboard-backlight/main/[^")]*' README.md \
            | sed 's|.*/main/||' \
            | sort -u > /tmp/readme-assets.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              echo "README references $f, which is not in the repository" >&2
              missing=1
            fi
          done < /tmp/readme-assets.txt
          exit "$missing"

      - name: Packed tarball contains no surprises
        run: |
          set -eu
          npm pack --dry-run
