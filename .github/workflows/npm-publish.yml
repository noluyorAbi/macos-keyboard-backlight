# Publish to npm on a version tag, using npm trusted publishing.
#
# There is no NPM_TOKEN here on purpose. Trusted publishing exchanges a short
# lived GitHub OIDC token for the right to publish this one package, so there is
# no long lived secret to leak, rotate or forget to revoke. It also produces a
# provenance attestation: npmjs.com then shows which repository, which commit and
# which workflow built the tarball.
#
# ONE TIME SETUP ON NPMJS.COM, BEFORE THE FIRST TAG:
#   1. The package must already exist. Trusted publishing cannot create a brand
#      new name, so version 1.0.0 is published once by hand, then never again.
#   2. Package, Settings, Trusted Publisher, GitHub Actions, filled in exactly:
#         Organization or user:  noluyorAbi
#         Repository:            macos-keyboard-backlight
#         Workflow filename:     npm-publish.yml
#         Environment:           leave empty
#      The workflow filename must match this file character for character.
#   3. Still in Settings, require two-factor or automation tokens, so a stolen
#      password alone cannot publish.
name: npm-publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    # Tests run on macOS for the same reason as in ci.yml: this package does
    # nothing meaningful on another platform.
    runs-on: macos-latest
    permissions:
      # id-token: write lets the runner mint the OIDC token npm exchanges.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job never pushes. Leaving the token in .git/config would let any
          # later step, including a compromised dependency, use it.
          persist-credentials: false

      # No "cache:" input here, deliberately. This job holds id-token: write, so
      # it is the one job where a cache entry poisoned by an earlier, less
      # trusted workflow run could end up inside a published tarball. The extra
      # thirty seconds of a cold install is worth removing that path entirely.
      # "registry-url:" is the usual suspect when a trusted-publishing job fails,
      # and it is worth writing down that it was tried and cleared, so the next
      # person does not spend the afternoon on it again.
      #
      # It is a suspect because setup-node reacts to it by writing a temporary
      # .npmrc holding //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and
      # pointing NPM_CONFIG_USERCONFIG at it. This workflow deliberately has no
      # NODE_AUTH_TOKEN, so that expands to an empty credential.
      #
      # On 2026-08-21, with v1.2.0 failing at "404 Not Found - PUT", the line was
      # removed to test that theory. The result was worse: npm then had no
      # credential at all, stopped at ENEEDAUTH, and no longer even reached the
      # provenance signing it had managed before. So the empty credential is not
      # what suppresses the OIDC exchange, and the line stays.
      #
      # What "404 Not Found - PUT" on an already published package means is that
      # the credential holds no publish right on that name; npm answers 404
      # rather than 403 so a probe cannot learn whether a package exists. The
      # thing to check is the trusted publisher on npmjs.com, not this file.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer, which is newer than the
      # npm bundled with the Node images. Pinned to a major rather than @latest:
      # this step runs with id-token: write, so an unpinned global install is a
      # supply chain hole in the one job that can publish.
      - name: Use a recent npm
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      # Refuse to publish a tag that disagrees with package.json. A version
      # published under the wrong number cannot be unpublished after 72 hours.
      - name: Tag matches package.json
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      # Print the tarball contents into the log. This is the last chance to
      # notice that something unintended is about to be published.
      - name: Pack, list the tarball contents
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --provenance --access public
